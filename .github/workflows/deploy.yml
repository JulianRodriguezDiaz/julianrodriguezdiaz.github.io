name: Publish to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          AE65A8: ${{ secrets.AE65A8 }}
          B8B715: ${{ secrets.B8B715 }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('AE65A8', '')
          meta_b = os.environ.get('B8B715', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- dfae77a363d64d968ac62a75a651008a15a1fc -->', meta_a)
          if meta_b:
              out = out.replace('<!-- 5fe91f361870ad0a9300da772e24de76c6fc49f8187b476a -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
